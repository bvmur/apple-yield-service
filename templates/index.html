<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <h1>Месяцы</h1>
    <ul>
        {% for month in months %}
        <li>
            <a href="/month/{{ month.id }}">
                <img src="{{ month.image_url }}" alt="{{ month.title }}" class="month-image">
                <h2>{{ month.title }}</h2>
            </a>
            <p>{{ month.phase }}</p>
            <p>{{ month.norm_temp }}°C</p>
            <p>{{ month.norm_precip }} мм</p>
            
        </li>
        {% endfor %}
    </ul>
</body>
</html>

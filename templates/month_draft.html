<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый месяц</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <a href="/month">Лента</a>
    <a href="/month/draft">Добавить</a>
    <a href="/">Плитка</a>

    <h1>Новый месяц</h1>
    <form>
        <label>Видео <input type="file" accept="video/*"></label>
        <label>Фото <input type="file" accept="image/*"></label>

        <label>Месяц <input type="text" value="{{ draft.title if draft else '' }}"></label>
        <label>Фаза <input type="text" value="{{ draft.phase if draft else '' }}"></label>
        <label>Норма температуры, °C <input type="number" value="{{ draft.norm_temp if draft else '' }}"></label>
        <label>Норма осадков, мм <input type="number" value="{{ draft.norm_precip if draft else '' }}"></label>
        <label>Описание <textarea>{{ draft.description if draft else '' }}</textarea></label>
    </form>
</body>
</html>

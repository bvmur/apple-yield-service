<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый месяц</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/months.css?v=3">
</head>
<body>
<div class="screen">
    <header class="topbar">
        <h1 class="page-title">{{ draft.title if draft else "Новый месяц" }}</h1>
        <p class="page-subtitle">
            {% if draft %}Шаг 2 из 2: заполните данные и опубликуйте{% else %}Шаг 1 из 2: название, видео и фото{% endif %}
        </p>
    </header>

    <main class="content">

        {% if not draft %}
        <!-- Шаг 1. Черновика нет: «Далее» создаёт его (POST /months/draft).
             Форма без enctype="multipart/form-data": браузер отправляет
             не сами файлы, а только их имена — их сервер и пишет в БД как url. -->
        <form method="post" action="/months/draft">
            <!-- Клик по блоку открывает выбор файла (label + скрытый input type=file) -->
            <label class="picker">
                <input class="picker__file" type="file" name="video" accept="video/*" required>
                <span class="picker__preview picker__preview--video">
                    <svg class="icon" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
                </span>
                <span>
                    <span class="picker__title">Видео</span>
                    <span class="picker__hint">Вертикальное 9:16, MP4</span>
                    <span class="picker__action"></span>
                </span>
            </label>

            <label class="picker">
                <input class="picker__file" type="file" name="photo" accept="image/*" required>
                <span class="picker__preview picker__preview--photo">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
                </span>
                <span>
                    <span class="picker__title">Фото карточки</span>
                    <span class="picker__hint">JPG или PNG</span>
                    <span class="picker__action"></span>
                </span>
            </label>

            <div class="form">
                <label class="field">
                    <span class="field__label">Месяц</span>
                    <input class="field__input" type="text" name="title" maxlength="30" required
                           placeholder="Например, Ноябрь">
                </label>
            </div>

            <button class="btn btn--wide" type="submit">Далее</button>
        </form>

        {% else %}
        <!-- Шаг 2. Черновик есть. Фото и видео можно выбрать заново через проводник (клик по блоку),
             но в ЛР2 файлы на сервер не передаются: в превью — url из БД, а если он недоступен — медиа по умолчанию.
             «Опубликовать» заполняет поля и меняет статус (POST /months/draft/publish). -->
        <form method="post" action="/months/draft/publish" novalidate>
            <label class="picker">
                <input class="picker__file" type="file" name="video" accept="video/*">
                <video class="picker__preview picker__preview--video media-fallback"
                       style="background-image: {% if draft.image_url %}url('{{ draft.image_url }}'), {% endif %}url('/static/media/default.jpg')"
                       autoplay loop muted playsinline>
                    {% if draft.video_url %}<source src="{{ draft.video_url }}">{% endif %}
                    <source src="/static/media/default.mp4" type="video/mp4">
                </video>
                <span>
                    <span class="picker__title">Видео</span>
                    <span class="picker__hint">Вертикальное 9:16, MP4</span>
                    <span class="picker__action picker__action--change"></span>
                </span>
            </label>

            <label class="picker">
                <input class="picker__file" type="file" name="photo" accept="image/*">
                <span class="picker__preview picker__preview--photo media-fallback" role="img" aria-label="{{ draft.title }}"
                      style="background-image: {% if draft.image_url %}url('{{ draft.image_url }}'), {% endif %}url('/static/media/default.jpg')"></span>
                <span>
                    <span class="picker__title">Фото карточки</span>
                    <span class="picker__hint">JPG или PNG</span>
                    <span class="picker__action picker__action--change"></span>
                </span>
            </label>

            <div class="form">
                <div class="field-row">
                    <label class="field">
                        <span class="field__label">Температура, °C</span>
                        <input class="field__input" type="number" name="norm_temp" min="-50" max="50"
                               value="{{ draft.norm_temp if draft.norm_temp is not none else '' }}">
                    </label>
                    <label class="field">
                        <span class="field__label">Осадки, мм</span>
                        <input class="field__input" type="number" name="norm_precip" min="0" max="1000"
                               value="{{ draft.norm_precip if draft.norm_precip is not none else '' }}">
                    </label>
                </div>
                <label class="field">
                    <span class="field__label">Описание</span>
                    <textarea class="field__input field__input--area" name="description" maxlength="1000"
                              placeholder="Что происходит с деревом и главный риск месяца">{{ draft.description or '' }}</textarea>
                </label>
            </div>

            <button class="btn btn--wide" type="submit">Опубликовать</button>
        </form>
        {% endif %}
    </main>

    <nav class="tabbar">
        <a class="tab {{ 'tab--active' if active_tab == 'feed' }}" href="/months/feed">
            <svg class="icon" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            Лента
        </a>
        <a class="tab {{ 'tab--active' if active_tab == 'draft' }}" href="/months/draft">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
            Добавить
        </a>
        <a class="tab {{ 'tab--active' if active_tab == 'list' }}" href="/months">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Плитка
        </a>
    </nav>
</div>
</body>
</html>

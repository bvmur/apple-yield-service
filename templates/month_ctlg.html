<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <a href="/month">Лента</a>
    <a href="/month/draft">Добавить</a>   <!-- маршрут черновика сделаем позже -->
    <a href="/">Плитка</a>
    <h1>Месяцы</h1>
    <form method="get" action="/">
        <label for="temp_from">
            Температура от: {{ temp ~ " °C" if temp is not none else "любая" }}
        </label>
        <input type="range" id="temp_from" name="temp_from"
            min="-10" max="25" step="1"
            value="{{ temp if temp is not none else -10 }}">
        <button type="submit">Показать</button>
    </form>
    <ul>
        {% for month in months %}
        <li>
            <a href="/month/{{ month.id }}">
                <img src="{{ month.image_url }}" alt="{{ month.title }}" class="month-image">
                <h2>{{ month.title }}</h2>
            </a>
            <p>{{ month.phase }}</p>
            <p>{{ month.norm_temp }}°C</p>
            <p>{{ month.norm_precip }} мм</p>
            <p>❤ {{ month.likes_count }}</p>
        </li>
        {% else %}
        <li>Нет месяцев с такой температурой</li>
        {% endfor %}
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ month.title }}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body class="detail-page-body">
    <a href="/month">Лента</a>
    <a href="/month/draft">Добавить</a>   <!-- маршрут черновика сделаем позже -->
    <a href="/">Плитка</a>
    <header class="detail-header">
        <a href="/" class="home-link">Months Catalog App</a>
    </header>

    <main class="video-layout">
        <div class="tiktok-container">
            <video autoplay loop muted playsinline>
                <source src="{{ month.video_url }}" type="video/mp4">
            </video>
            
            <div class="description-overlay">
                <strong>{{ month.title }}</strong><br>
                {{ month.description }}
                <a href="/month/{{ month.id }}?next=true">→ Следующий</a>
                <p> ❤ {{ month.likes_count }} </p>
            </div>
        </div>
    </main>
    
</body>
</html>
